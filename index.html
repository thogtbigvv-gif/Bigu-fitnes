<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0C">
  <meta name="description" content="Өдөр тутмын дасгалын төлөвлөгөө тэмдэглэгч">
  <title>Дасгалын тэмдэглэл</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='rgb(11,11,12)'/%3E%3Cpath d='M9 16.5l5 5 9-10' stroke='rgb(200,255,61)' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app">
    <main class="app-main" id="app-main">
      <section class="screen" id="screen-today" aria-labelledby="tab-today"></section>
      <section class="screen" id="screen-week" aria-labelledby="tab-week" hidden></section>
      <section class="screen" id="screen-history" aria-labelledby="tab-history" hidden></section>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Үндсэн цэс">
      <button class="tab is-active" id="tab-today" type="button" data-tab="today" aria-selected="true">Өнөөдөр</button>
      <button class="tab" id="tab-week" type="button" data-tab="week" aria-selected="false">Долоо хоног</button>
      <button class="tab" id="tab-history" type="button" data-tab="history" aria-selected="false">Түүх</button>
    </nav>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
