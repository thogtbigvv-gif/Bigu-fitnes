<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0C">
  <meta name="description" content="Өдөр тутмын дасгалын төлөвлөгөө тэмдэглэгч">
  <title>Дасгалын тэмдэглэл</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='rgb(11,11,12)'/%3E%3Cpath d='M9 16.5l5 5 9-10' stroke='rgb(222,222,227)' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <!-- Утсанд суулгах ба офлайн ажиллагаа. Бүх зам харьцангуй тул дэд
       замд (жишээ нь /Bigu-fitness/) байрлуулсан ч ажиллана. -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Дасгал">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app">
    <!-- Хадгалалт бүтэхгүй байвал (нууц горим, зай дүүрсэн) энд мессеж гарна. -->
    <div class="notice" id="notice" role="status" hidden></div>

    <!-- Шинэ хувилбар кэшэнд бэлэн болоход энд зурвас гарна (js/updates.js). -->
    <div class="update" id="update" role="status" hidden></div>

    <main class="app-main" id="app-main">
      <section class="screen" id="screen-today" role="tabpanel" aria-labelledby="tab-today" tabindex="0"></section>
      <section class="screen" id="screen-week" role="tabpanel" aria-labelledby="tab-week" tabindex="0" hidden></section>
      <section class="screen" id="screen-history" role="tabpanel" aria-labelledby="tab-history" tabindex="0" hidden></section>
    </main>

    <nav class="tabbar" id="tabbar" role="tablist" aria-label="Үндсэн цэс">
      <span class="tab-ind" id="tab-ind" aria-hidden="true"></span>

      <button class="tab is-active" id="tab-today" type="button" role="tab" data-tab="today"
              aria-selected="true" aria-controls="screen-today" tabindex="0">
        <span class="tab__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4.5" width="18" height="16.5" rx="2.5"></rect>
            <path d="M8 2.5v4M16 2.5v4M3 10h18"></path>
            <path d="M9 14.5l2 2 4-4"></path>
          </svg>
        </span>
        <span class="tab__label">Өнөөдөр</span>
      </button>

      <button class="tab" id="tab-week" type="button" role="tab" data-tab="week"
              aria-selected="false" aria-controls="screen-week" tabindex="-1">
        <span class="tab__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2.5"></rect>
            <path d="M3 10h18M9 10v9M15 10v9"></path>
          </svg>
        </span>
        <span class="tab__label">Долоо хоног</span>
      </button>

      <button class="tab" id="tab-history" type="button" role="tab" data-tab="history"
              aria-selected="false" aria-controls="screen-history" tabindex="-1">
        <span class="tab__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 12a8.5 8.5 0 1 0 2.9-6.4"></path>
            <path d="M3.5 4.5V9H8"></path>
            <path d="M12 8v4.5l3 1.8"></path>
          </svg>
        </span>
        <span class="tab__label">Түүх</span>
      </button>
    </nav>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
