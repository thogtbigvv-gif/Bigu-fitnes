<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <meta name="description" content="Өдөр тутмын дасгалын төлөвлөгөө тэмдэглэгч">
  <title>Дасгалын тэмдэглэл</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='rgb(14,17,22)'/%3E%3Cpath d='M9 16.5l5 5 9-10' stroke='rgb(74,222,128)' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div class="app">
    <main class="app-main" id="app-main">
      <section class="screen" id="screen-today" aria-labelledby="tab-today"></section>
      <section class="screen" id="screen-week" aria-labelledby="tab-week" hidden></section>
      <section class="screen" id="screen-history" aria-labelledby="tab-history" hidden></section>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Үндсэн цэс">
      <button class="tab is-active" id="tab-today" type="button" data-tab="today" aria-selected="true">
        <span class="tab__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 12l2 2 4-4"></path>
            <rect x="3" y="4" width="18" height="17" rx="3"></rect>
            <path d="M8 2v4M16 2v4M3 10h18"></path>
          </svg>
        </span>
        <span class="tab__label">Өнөөдөр</span>
      </button>
      <button class="tab" id="tab-week" type="button" data-tab="week" aria-selected="false">
        <span class="tab__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="15" rx="3"></rect>
            <path d="M3 10h18M9 10v10M15 10v10"></path>
          </svg>
        </span>
        <span class="tab__label">Долоо хоног</span>
      </button>
      <button class="tab" id="tab-history" type="button" data-tab="history" aria-selected="false">
        <span class="tab__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7"></path>
            <path d="M3 4v5h5"></path>
            <path d="M12 8v5l3 2"></path>
          </svg>
        </span>
        <span class="tab__label">Түүх</span>
      </button>
    </nav>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
